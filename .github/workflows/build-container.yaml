name: Deploy

env:
  GCLOUD_SA_KEY: ${{ secrets.GCLOUD_SA_KEY }}
  GCLOUD_PROJECT: joshlong
  GH_TOKEN: ${{ secrets.MOGUL_GITHUB_PACKAGES_PERSONAL_ACCESS_TOKEN }}
  GH_USER: ${{ github.actor }}
  APP_NAME: api
  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Container
    runs-on: mogul
    steps:
      - uses: actions/checkout@v7

      - uses: bootiful-media-mogul/github-actions-setup-jvm-build-env@main
        with:
          gh_token: ${{ env.GH_TOKEN }}
          gh_user: ${{ env.GH_USER }}

      # a GitHub-hosted runner has 16 GB of RAM, and native-image sizes its heap from that,
      # leaving too little for everything else; the kernel then kills the runner mid-build.
      # cap the heap and back it with swap so a big build gets slower instead of dying.
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Pnative native:compile
        env:
          NATIVE_IMAGE_OPTIONS: -J-Xmx13g

      - uses: bootiful-media-mogul/github-actions-setup-container-build-env@main
        with:
          gh_token: ${{ env.GH_TOKEN }}
          app_name: ${{ env.APP_NAME }}
          gcloud_sa_key: '${{ secrets.GCLOUD_SA_KEY }}'
          gcloud_project: ${{ env.GCLOUD_PROJECT }}
