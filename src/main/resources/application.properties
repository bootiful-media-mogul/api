#
mogul.feeds.namespace=http://api.mogul.tools
mogul.feeds.element-prefix=mogul-feeds
#
spring.application.name=mogul-service
spring.datasource.connection-fetch=lazy
#
# elasticsearch
spring.elasticsearch.api-key=${ELASTICSEARCH_API_KEY}
spring.elasticsearch.uris=${ELASTICSEARCH_API_HOST}
spring.elasticsearch.restclient.sniffer.enabled=false
management.health.elasticsearch.enabled=false
# opentelemetry
# metrics
## (do NOT remove the fallback localhost:8200 values because this wont compile in graalvm otherwise)
management.otlp.metrics.export.url=${ELASTICSEARCH_OTEL_HOST:http://localhost:8200}/v1/metrics
management.otlp.metrics.export.headers.authorization=${ELASTICSEARCH_OTEL_HEADER}
## logging
management.opentelemetry.logging.export.otlp.endpoint=${ELASTICSEARCH_OTEL_HOST:http://localhost:8200}/v1/logs
management.opentelemetry.logging.export.otlp.headers.authorization=${ELASTICSEARCH_OTEL_HEADER}
## tracing
management.opentelemetry.tracing.export.otlp.endpoint=${ELASTICSEARCH_OTEL_HOST:http://localhost:8200}/v1/traces
management.opentelemetry.tracing.export.otlp.headers.authorization=${ELASTICSEARCH_OTEL_HEADER}
management.tracing.sampling.probability=1.0
#
# actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
#
spring.threads.virtual.enabled=true
#
# oauth
auth0.audience=${auth0.domain}api/v2/
auth0.userinfo=${auth0.domain}userinfo
#
spring.security.oauth2.resourceserver.jwt.issuer-uri=${auth0.domain}
spring.security.oauth2.resourceserver.jwt.audiences=${auth0.audience}
#
# modulith
spring.modulith.events.jdbc.schema-initialization.enabled=true
#
# aws
mogul.storage.aws.access-key=${AWS_ACCESS_KEY_ID}
mogul.storage.aws.access-key-secret=${AWS_ACCESS_KEY_SECRET}
mogul.storage.aws.region=${AWS_REGION}
#
mogul.debug=${DEBUG:false}
#
# general
spring.mvc.async.request-timeout=-1
#
# servlet
spring.servlet.multipart.max-file-size=3GB
spring.servlet.multipart.max-request-size=6GB
# 
# mustache for no reason at all
spring.mustache.check-template-location=false
# ai
spring.ai.openai.api-key=${OPENAI_KEY}
spring.ai.openai.chat.api-key=${OPENAI_KEY}
# ably
mogul.notifications.ably.api-key=${ABLY_KEY}
#
# settings
mogul.settings.salt=${SETTINGS_SALT:6d6f67756c}
mogul.settings.password=${SETTINGS_PASSWORD:p@ssw0rd}
#
logging.level.com.joshlong=debug
logging.level.org.springframework.jdbc.core.JdbcTemplate=debug
#
# sql
spring.sql.init.mode=always
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_SCHEMA:mogul}
spring.datasource.username=${DB_USERNAME:mogul}
spring.datasource.password=${DB_PASSWORD:mogul}
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=0
spring.datasource.hikari.connection-test-query=select 1
#
#spring.modulith.events.republish-outstanding-events-on-restart=false
#
spring.ai.openai.chat.model=gpt-5.4-mini
spring.ai.openai.chat.temperature=1
#
#spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# 
# managed files
mogul.aws.cloudfront.domain=https://d2m0e3ms5cjkrs.cloudfront.net
mogul.managed-files.s3.bucket=mogul-managedfiles-dev
mogul.cache.max-entries=10000
#
server.shutdown=immediate
#
spring.elasticsearch.connection-timeout=10s
#
# rabbitmq (see .envrc)
mogul.amqp.settings-events=${MOGUL_SETTINGS_EVENTS_DESTINATION_NAME:mogul-settings-events}
mogul.amqp.cache-evictions=${MOGUL_CACHE_EVICTIONS_DESTINATION_NAME:mogul-cache-evictions}
#
spring.rabbitmq.host=${RMQ_HOST}
spring.rabbitmq.username=${RMQ_USERNAME}
spring.rabbitmq.password=${RMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RMQ_VIRTUAL_HOST}
#
jobrunr.database.type=sql
jobrunr.background-job-server.enabled=true
# every publication goes through jobrunr, even "publish now" ones, and the default 15s
# poll is how long a user would wait before anything starts. 5s is jobrunr's minimum.
jobrunr.background-job-server.poll-interval-in-seconds=5
jobrunr.database.skip-create=true
jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:false}
